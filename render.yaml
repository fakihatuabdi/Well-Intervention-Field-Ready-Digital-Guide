databases:
  - name: wi-field-guide-db
    plan: free
    databaseName: wi_field_guide
    user: wi_field_guide

services:
  - type: web
    name: Well-Intervention-Field-Ready-Digital-Guide
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: wi-field-guide-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
